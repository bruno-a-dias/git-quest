name: Fotos dos heróis

# Troca os selos provisórios (silhueta) pela foto real do GitHub, dentro dos anéis animados.
# Dourado para o dono do projeto, ciano para os demais.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Refazer todos os selos (use se alguém trocou a foto do perfil)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - README.md
      - i18n/README.*.md
      - .github/scripts/heroes.py

permissions:
  contents: write

jobs:
  heroes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Gerar selos
        env:
          HERO_OWNER: ${{ github.repository_owner }}
        run: python .github/scripts/heroes.py --scan ${{ inputs.force && '--force' || '' }}
      - name: Commitar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/heroes
          git diff --staged --quiet || (git commit -m "chore: atualiza fotos dos heróis" && git push)
