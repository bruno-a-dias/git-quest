name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unitarios:
    name: Motor, missões, idiomas, progresso, troféus, PDF e PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Selos dos heróis (gerador de SVG)
        run: python tests/test_heroes.py

  navegador:
    name: Jogo completo no navegador (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Joga as 40 missões nos 8 idiomas e testa extras (desafio, revisão, offline) e o painel da turma
        run: npm run test:e2e:all
      - name: Guarda os diplomas gerados em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diplomas-png
          path: |
            /tmp/gq-diploma-*.png
            /tmp/gq-verso-*.png
          if-no-files-found: ignore
