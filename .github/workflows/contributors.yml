name: Adicionar Contribuidor ao README

on:
  pull_request_target:
    types: [closed]

jobs:
  add-contributor:
    # Só roda se o PR foi aceito (merged)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permissão necessária para o bot conseguir salvar o arquivo

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Rodar script de atualização
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python .github/scripts/update_contributors.py

      - name: Commitar e enviar as alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md i18n/ assets/heroes/
          # Só commita se houver alteração (evita erro caso o contribuidor já exista)
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: adiciona card de contribuição para @${{ env.PR_AUTHOR }}" && git push)